description: |
  # My Social Networks API

  Documentation fonctionnelle et technique de l'API REST du TP de conception d'API du M1 Data Engineering & IA.

  ## Présentation

  Cette API modélise un réseau social orienté événements. Elle permet de gérer les utilisateurs, les événements, les groupes, les fils de discussion, les messages, les albums photo, les sondages, la billetterie, la shopping list et le covoiturage.

  L'API est disponible localement à l'adresse `http://localhost:3000`. Le stockage est en mémoire pour faciliter la démonstration ; les données sont réinitialisées à chaque redémarrage.

  ## Démarrage

  ```bash
  npm install
  npm start
  ```

  Vérifier le service avec `GET {{baseUrl}}/health`.

  ## Organisation technique

  - `src/server.mjs` assemble le serveur HTTP.
  - `src/controllers/api.controller.mjs` reçoit les requêtes et applique le comportement CRUDS.
  - `src/models/store.mjs` initialise les collections et les données de démonstration.
  - `src/models/validation.mjs` contrôle les champs, les relations et les règles métier.
  - `test/api.test.mjs` contient les tests automatisés.

  Cette séparation permet de remplacer ultérieurement le stockage mémoire par MongoDB/Mongoose sans modifier le contrat HTTP.

  ## Conventions de réponse

  Une ressource est retournée sous la propriété `data` : `{ "data": { "id": "resource-id" } }`.

  Une liste est retournée avec `data` et `pagination` : `{ "data": [], "pagination": { "page": 1, "limit": 20, "total": 0 } }`.

  Une erreur respecte le format `{ "error": { "status": 400, "message": "Description de l'erreur" } }`.

  Codes utilisés : `200` lecture ou modification, `201` création, `204` suppression, `400` validation ou JSON invalide, `404` ressource absente, `409` conflit métier et `405` méthode non autorisée.

  ## Ressources exposées

  - `/api/v1/users` : utilisateurs et email unique.
  - `/api/v1/events` : événements, organisateurs, membres et options de services.
  - `/api/v1/groups` : groupes publics, privés ou secrets.
  - `/api/v1/discussions` : fils liés à un groupe ou à un événement.
  - `/api/v1/messages` : messages appartenant à un fil.
  - `/api/v1/albums` et `/api/v1/photos` : médias associés aux événements.
  - `/api/v1/polls` : sondages créés par un organisateur.
  - `/api/v1/ticketTypes` et `/api/v1/tickets` : billetterie limitée.
  - `/api/v1/shoppingItems` : contributions uniques si la shopping list est activée.
  - `/api/v1/carpools` : trajets si le covoiturage est activé.

  ## Règles métier

  Un utilisateur possède un email valide et unique. Un événement possède au moins un organisateur, une liste de membres, une visibilité `public` ou `private`, et une date de fin postérieure à sa date de début. Les références d'utilisateurs doivent exister.

  Un groupe possède au moins un membre et un administrateur. Son type est `public`, `private` ou `secret`. Les permissions `allowMemberPosts` et `allowMemberEvents` contrôlent les actions disponibles.

  Une discussion appartient exactement à un groupe ou à un événement. Une photo doit appartenir à un album et être publiée par un membre de l'événement. Un sondage est créé par un organisateur et chaque question possède au moins deux options.

  La billetterie est réservée aux événements publics. La quantité d'un type de billet est limitée et une personne ne peut acheter qu'un billet par événement. La shopping list et le covoiturage nécessitent l'activation de l'option correspondante.

  ## Exemple de sondage

  `{ "eventId": "EVENT_ID", "createdBy": "ORGANIZER_ID", "title": "Horaire préféré", "questions": [{ "label": "Quel horaire ?", "options": ["18h", "19h", "20h"] }] }`

  ## Workflow de démonstration

  1. Appeler `GET /health`.
  2. Appeler `GET /api/v1/users` et conserver un `USER_ID`.
  3. Créer un événement avec `USER_ID` dans `organizers` et `members`.
  4. Conserver l'`EVENT_ID` retourné.
  5. Créer un groupe avec `USER_ID` comme membre et administrateur.
  6. Créer une discussion liée à l'événement ou au groupe, mais pas aux deux.
  7. Créer un message, un album, une photo et un sondage avec les identifiants correspondants.
  8. Tester un type de billet sur un événement public.
  9. Tester la shopping list et le covoiturage avec les options activées.

  ## Pagination et filtres

  Les listes acceptent `page` et `limit`. `page` vaut 1 par défaut, `limit` vaut 20 et est plafonné à 100. Les autres paramètres sont des filtres simples.

  Exemple : `GET {{baseUrl}}/api/v1/events?visibility=public&page=1&limit=10`.

  ## Tests et remise

  Exécuter `npm test` avant la remise. Les tests couvrent le health check, les utilisateurs, l'unicité des emails, les dates d'événement, les discussions, les sondages et la billetterie. La collection Postman fournit les scénarios manuels et les exemples de payloads.

  Après vérification, cliquer sur **Publish docs**, choisir une visibilité publique et ajouter l'URL générée dans le `README.md`.
variables:
